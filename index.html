<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus JEE — Advanced AI Cognitive Tutoring Suite</title>
    <meta name="description" content="Master JEE Mains Physics & Chemistry with personalized AI scaffolding, concept-ladder learning, spaced repetition, and full-length simulated mock tests." />
    
    <!-- SEO / Theme -->
    <meta name="theme-color" content="#09090b" />
    <meta name="robots" content="index, follow" />
    
    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus JEE" />
    <link rel="apple-touch-icon" href="pwa-192x192.png" />
    
    <!-- OpenGraph Metadata -->
    <meta property="og:title" content="Nexus JEE — Advanced AI Cognitive Tutoring Suite" />
    <meta property="og:description" content="Master JEE Mains Physics & Chemistry with personalized AI scaffolding, concept-ladder learning, spaced repetition, and full-length simulated mock tests." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexus JEE" />
    <meta property="og:image" content="/favicon.svg" />
    
    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Nexus JEE — Advanced AI Cognitive Tutoring Suite" />
    <meta name="twitter:description" content="Master JEE Mains Physics & Chemistry with personalized AI scaffolding, concept-ladder learning, spaced repetition, and full-length simulated mock tests." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div class="preloader-container">
        <div class="preloader-logo-area">
          <div class="preloader-glow"></div>
          <svg class="preloader-hexagon" width="80" height="80" viewBox="0 0 64 64" fill="none">
            <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" stroke="url(#preloaderGrad)" stroke-width="3" />
            <defs>
              <linearGradient id="preloaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7c3aed" />
                <stop offset="100%" stop-color="#06b6d4" />
              </linearGradient>
            </defs>
          </svg>
          <div class="preloader-inner">N</div>
        </div>
        <h1 class="preloader-title">NEXUS JEE</h1>
        <p class="preloader-subtitle">Initializing Cognitive Engine...</p>
      </div>
      <style>
        body {
          margin: 0;
          background-color: #030014;
        }
        .preloader-container {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #030014;
          font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          z-index: 9999;
        }
        .preloader-logo-area {
          position: relative;
          width: 80px;
          height: 80px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 24px;
        }
        .preloader-glow {
          position: absolute;
          width: 60px;
          height: 60px;
          background: radial-gradient(circle, rgba(124, 58, 237, 0.4) 0%, transparent 70%);
          filter: blur(8px);
          animation: pulse-glow 2s infinite ease-in-out;
        }
        .preloader-hexagon {
          position: absolute;
          width: 100%;
          height: 100%;
          animation: spin-hexagon 2s infinite linear;
        }
        .preloader-inner {
          font-family: 'JetBrains Mono', monospace;
          font-size: 28px;
          font-weight: 900;
          color: #06b6d4;
          text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
          animation: pulse-logo 2s infinite ease-in-out;
        }
        .preloader-title {
          font-size: 22px;
          font-weight: 900;
          color: #ffffff;
          letter-spacing: 0.2em;
          margin: 0 0 8px 0;
          text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        .preloader-subtitle {
          font-size: 13px;
          font-weight: 500;
          color: #64748b;
          letter-spacing: 0.05em;
          margin: 0;
        }
        @keyframes spin-hexagon {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes pulse-glow {
          0%, 100% { transform: scale(0.9); opacity: 0.5; }
          50% { transform: scale(1.3); opacity: 1; }
        }
        @keyframes pulse-logo {
          0%, 100% { transform: scale(0.95); }
          50% { transform: scale(1.05); }
        }
      </style>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
