services:
  - type: web
    name: nexus-jee-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/health
    disk:
      name: nexus-jee-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/nexus_jee.db
      - key: JWT_SECRET
        generateValue: true
      - key: FERNET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://nexus-jee-peach.vercel.app
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
