<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Glow Hexagon -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" stroke="url(#glowGrad)" stroke-width="3" filter="url(#glow)" opacity="0.8" />
  <!-- Inner Hexagon -->
  <polygon points="32,12 50,22 50,42 32,52 14,42 14,22" fill="url(#glowGrad)" fill-opacity="0.15" stroke="url(#glowGrad)" stroke-width="1.5" />
  <!-- Center Core Node -->
  <circle cx="32" cy="32" r="6" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
  <!-- Connective Nodes -->
  <circle cx="32" cy="12" r="3" fill="#7c3aed" />
  <line x1="32" y1="12" x2="32" y2="26" stroke="#7c3aed" stroke-width="1" />
  <circle cx="50" cy="22" r="3" fill="#06b6d4" />
  <circle cx="50" cy="42" r="3" fill="#d946ef" />
  <circle cx="32" cy="52" r="3" fill="#7c3aed" />
  <circle cx="14" cy="42" r="3" fill="#d946ef" />
  <circle cx="14" cy="22" r="3" fill="#06b6d4" />
</svg>